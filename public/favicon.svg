<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hub-ring" x1="50" y1="20" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#000000" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#27272a" stroke-width="2" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#hub-ring)" stroke-width="3" stroke-dasharray="4 2" />
  <!-- North Needle (Cycling) -->
  <polygon points="50,18 57,50 50,44 43,50" fill="#10b981" />
  <!-- South Needle (Trail) -->
  <polygon points="50,82 57,50 50,56 43,50" fill="#f97316" />
  <!-- Core -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
</svg>
